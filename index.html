<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои ссылки — Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="profile">
      <!-- Замените src на путь к вашему фото (например, avatar.jpg в той же папке) -->
      <div class="avatar" aria-hidden="true">МА</div>
      <h1>Матвей</h1>
      <p class="bio">Делаю проекты, изучаю разработку и делюсь полезным здесь.</p>
    </header>

    <nav class="links" aria-label="Основные ссылки">
      <a class="link-btn primary" href="https://t.me/username" target="_blank" rel="noopener">
        Telegram-канал
      </a>
      <a class="link-btn" href="https://github.com/username" target="_blank" rel="noopener">
        GitHub
      </a>
      <a class="link-btn" href="https://youtube.com/@username" target="_blank" rel="noopener">
        YouTube
      </a>
      <a class="link-btn" href="mailto:hello@example.com">
        Написать на почту
      </a>
    </nav>

    <footer class="footer">
      <span>© 2026</span>
    </footer>
  </main>
</body>
</html>
