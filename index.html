<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sekailauren — Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Холст для снежинок на фоне и за курсором -->
  <canvas id="snow-canvas"></canvas>

  <!-- Стартовый экран с блюром и надписью >my bio< -->
  <div id="entry-screen" class="entry-overlay">
    <button id="enter-btn" class="entry-text" type="button">
      <span class="bracket">&gt;</span>my bio<span class="bracket">&lt;</span>
    </button>
  </div>

  <!-- Плавающий мини-плеер в стиле скрина -->
  <aside id="mini-player" class="mini-player" aria-label="Аудиоплеер">
    <audio id="audio-element" src="track.mp3" preload="metadata"></audio>

    <img id="player-cover" class="player-cover" src="avatar.jpg" alt="Обложка трека">

    <div class="player-body">
      <div id="player-title" class="player-title">again</div>
      <div class="player-timeline">
        <span id="current-time" class="player-time">00:00</span>
        <input
          id="seek-slider"
          class="player-slider seek-slider"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Перемотка трека"
        >
        <span id="duration-time" class="player-time">00:00</span>
      </div>
    </div>

    <div class="player-controls">
      <button id="play-pause-btn" class="play-btn" type="button" aria-label="Воспроизвести или поставить на паузу">
        <svg id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <svg id="icon-pause" class="hidden-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </button>

      <input
        id="volume-slider"
        class="player-slider volume-slider"
        type="range"
        min="0"
        max="1"
        value="0.7"
        step="0.01"
        aria-label="Громкость"
      >
    </div>
  </aside>

  <!-- Основной контент -->
  <main id="main-content" class="container hidden">
    <header class="profile flip-item" style="--delay: 0.05s;">
      <img class="avatar-img" src="avatar.jpg" alt="Аватар sekailauren">
      <h1>sekailauren</h1>
      <p class="bio">16 y. o. вайбкодер, делаю разные проекты на python, C++.</p>
    </header>

    <nav class="links" aria-label="Основные ссылки">
      <a class="link-btn tg-btn flip-item" style="--delay: 0.18s;" href="https://t.me/sekailauren" target="_blank" rel="noopener">
        <span>Telegram</span>
      </a>
      <a class="link-btn gray-btn flip-item" style="--delay: 0.30s;" href="https://github.com/zxckill666" target="_blank" rel="noopener">
        <span>GitHub</span>
      </a>
      <a class="link-btn gray-btn flip-item" style="--delay: 0.42s;" href="https://soundcloud.com/kawaimonster87" target="_blank" rel="noopener">
        <span>SoundCloud</span>
      </a>
      <a class="link-btn gray-btn flip-item" style="--delay: 0.54s;" href="mailto:bilyaeva.02031993@outlook.com">
        <span>Написать на почту</span>
      </a>
    </nav>

    <footer class="footer flip-item" style="--delay: 0.66s;">
      <span>© 2026</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
