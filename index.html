<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sekailauren — Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Холст для снежинок на фоне и за курсором -->
  <canvas id="snow-canvas"></canvas>

  <!-- Счетчик просмотров с глазиком в правом верхнем углу -->
  <div id="views-badge" class="views-badge" title="Просмотры страницы">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <span id="views-count">—</span>
  </div>

  <!-- Стартовый экран с блюром и надписью >my bio< -->
  <div id="entry-screen" class="entry-overlay">
    <button id="enter-btn" class="entry-text" type="button">
      <span class="bracket">&gt;</span>my bio<span class="bracket">&lt;</span>
    </button>
  </div>

  <!-- Полупрозрачный проигрыватель с CAVA-полосками и плавным перемещением -->
  <header class="top-player-wrap" aria-label="Аудиоплеер">
    <div id="top-player" class="top-player">
      <audio id="audio-element" src="track.mp3" preload="metadata" crossorigin="anonymous"></audio>

      <img class="top-player-cover" src="cover.jpg" alt="Обложка The Beginning">

      <div class="top-player-main">
        <div class="top-player-header">
          <div class="title-and-cava">
            <span class="top-player-title">The Beginning</span>
            <canvas id="cava-canvas" class="cava-canvas" width="54" height="16" aria-hidden="true"></canvas>
          </div>
          <span class="top-player-time">
            <span id="current-time">00:00</span> / <span id="duration-time">00:00</span>
          </span>
        </div>

        <div id="progress-track-wrap" class="progress-track-wrap">
          <div class="progress-rail">
            <div id="progress-fill" class="progress-fill">
              <span id="progress-thumb" class="progress-thumb"></span>
            </div>
          </div>
          <canvas id="progress-particles" class="progress-particles"></canvas>
          <input
            id="seek-slider"
            class="seek-input"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.005"
            aria-label="Перемотка трека"
          >
        </div>
      </div>

      <div class="top-player-actions">
        <button id="play-pause-btn" class="player-action-btn" type="button" aria-label="Воспроизвести или пауза">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="7 5 20 12 7 19 7 5"></polygon>
          </svg>
          <svg id="icon-pause" class="hidden-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1"></rect>
            <rect x="14" y="5" width="4" height="14" rx="1"></rect>
          </svg>
        </button>

        <div id="volume-control" class="volume-control">
          <button id="mute-btn" class="player-action-btn" type="button" aria-label="Звук вкл/выкл">
            <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="icon-sound-off" class="hidden-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- Выезжает вниз из-под кнопки звука -->
          <div id="volume-drawer" class="volume-drawer">
            <div class="volume-inner">
              <div class="volume-bar-visual">
                <div id="volume-fill" class="volume-fill"></div>
                <div id="volume-thumb" class="volume-thumb"></div>
              </div>
              <canvas id="volume-particles" class="volume-particles"></canvas>
              <input
                id="volume-slider"
                class="volume-slider"
                type="range"
                min="0"
                max="1"
                value="0.75"
                step="0.005"
                aria-label="Громкость"
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main id="main-content" class="container hidden">
    <header class="profile flip-item" style="--delay: 0.05s;">
      <img class="avatar-img" src="avatar.jpg" alt="Аватар sekailauren">
      <h1>sekailauren</h1>
      <p class="bio">16 y. o. вайбкодер, делаю разные проекты на python, C++.</p>
    </header>

    <nav class="links" aria-label="Основные ссылки">
      <a class="link-btn tg-btn tilt-btn flip-item" style="--delay: 0.18s;" href="https://t.me/sekailauren" target="_blank" rel="noopener">
        <span>Telegram</span>
      </a>
      <a class="link-btn gray-btn tilt-btn flip-item" style="--delay: 0.30s;" href="https://github.com/zxckill666" target="_blank" rel="noopener">
        <span>GitHub</span>
      </a>
      <a class="link-btn gray-btn tilt-btn flip-item" style="--delay: 0.42s;" href="https://soundcloud.com/kawaimonster87" target="_blank" rel="noopener">
        <span>SoundCloud</span>
      </a>
      <a class="link-btn gray-btn tilt-btn flip-item" style="--delay: 0.54s;" href="mailto:bilyaeva.02031993@outlook.com">
        <span>Написать на почту</span>
      </a>
    </nav>

    <footer class="footer flip-item" style="--delay: 0.66s;">
      <span>© 2026</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
